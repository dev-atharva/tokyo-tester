services:
  mysql:
    image: mysql:8.4
    container_name: tokyo-tester-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tokyo-dev-root-password}
      MYSQL_DATABASE: tokyo_runner
      MYSQL_USER: tokyo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tokyo-dev-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sh:/docker-entrypoint-initdb.d/001-tokyo-databases.sh:ro
    networks:
      - tokyo-tester
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  runner:
    build:
      context: ./runner-v2
      dockerfile: Dockerfile
      target: dev
    environment:
      APP_ENV: development
      DB_TYPE: ${RUNNER_DB_TYPE:-mysql}
      DATABASE_URL: ${RUNNER_DATABASE_URL:-tokyo:${MYSQL_PASSWORD:-tokyo-dev-password}@tcp(mysql:3306)/tokyo_runner}
      WORKFLOW_WORKER_ENABLED: ${WORKFLOW_WORKER_ENABLED:-true}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-2}
      WORKFLOW_SCENARIO_CONCURRENCY: ${WORKFLOW_SCENARIO_CONCURRENCY:-2}
      WORKFLOW_JOB_ENCRYPTION_KEY: ${WORKFLOW_JOB_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      BROWSER_CHROMIUM_SANDBOX: ${BROWSER_CHROMIUM_SANDBOX:-false}
    entrypoint: ["air", "-c", ".air.toml"]
    command: []
    volumes:
      - ./runner-v2:/app
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:${CONTAINER_DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    depends_on:
      mysql:
        condition: service_healthy

  ui:
    build:
      context: ./ui-v2
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      COTS_API_BASE_URL: ${COTS_API_BASE_URL:-http://runner:8080}
      DB_TYPE: ${UI_DB_TYPE:-mysql}
      DATABASE_URL: ${UI_DATABASE_URL:-mysql://tokyo:${MYSQL_PASSWORD:-tokyo-dev-password}@mysql:3306/tokyo_ui}
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-local-dev-mcp-internal-secret-32-bytes}
      MCP_AUTH_MODE: personal_token
    extra_hosts:
      - "host.docker.internal=host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ./ui-v2:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mysql:
        condition: service_healthy
      runner:
        condition: service_healthy
    command: ["sh", "-c", "bun run db:migrate && bun run dev"]

  mcp:
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PORT: 8090
      TOKYO_TESTER_APP_URL: http://ui:3000
      MCP_ALLOWED_ORIGIN: ${MCP_ALLOWED_ORIGIN:-http://localhost:3000}
      MCP_PUBLIC_URL: http://localhost:8090/mcp
      MCP_AUTH_MODE: personal_token
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-local-dev-mcp-internal-secret-32-bytes}

volumes:
  mysql_data:
