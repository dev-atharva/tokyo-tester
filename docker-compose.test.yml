services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: tokyo-test-root-password
      MYSQL_DATABASE: ui_auth_test
    volumes:
      - ./scripts/mysql-test-init.sh:/docker-entrypoint-initdb.d/001-test-databases.sh:ro
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-33306}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
