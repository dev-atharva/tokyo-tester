apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokyo-mcp
  namespace: tokyo-tester
  labels:
    app.kubernetes.io/name: tokyo-mcp
    app.kubernetes.io/part-of: tokyo-tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tokyo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokyo-mcp
        app.kubernetes.io/part-of: tokyo-tester
    spec:
      containers:
        - name: mcp
          image: tokyo-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: TOKYO_TESTER_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: tokyo-config
                  key: ui-url
            - name: MCP_ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tokyo-config
                  key: public-origin
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
