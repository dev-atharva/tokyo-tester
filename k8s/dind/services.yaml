apiVersion: v1
kind: Service
metadata:
  name: tokyo-runner
  namespace: tokyo-tester
  labels:
    app.kubernetes.io/name: tokyo-runner
    app.kubernetes.io/part-of: tokyo-tester
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tokyo-runner
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tokyo-ui
  namespace: tokyo-tester
  labels:
    app.kubernetes.io/name: tokyo-ui
    app.kubernetes.io/part-of: tokyo-tester
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tokyo-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tokyo-mcp
  namespace: tokyo-tester
  labels:
    app.kubernetes.io/name: tokyo-mcp
    app.kubernetes.io/part-of: tokyo-tester
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tokyo-mcp
  ports:
    - name: http
      port: 8090
      targetPort: http
