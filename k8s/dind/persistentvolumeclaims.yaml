apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-data
  namespace: tokyo-tester
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ui-data
  namespace: tokyo-tester
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
