apiVersion: v1
kind: Secret
metadata:
  name: tokyo-secrets
  namespace: tokyo-tester
type: Opaque
stringData:
  auth-secret: "replace-with-a-long-random-secret"
  workflow-job-encryption-key: "replace-with-openssl-rand-base64-32"
  runner-database-url: "tokyo:replace-with-password@tcp(mysql.example.internal:3306)/tokyo_runner"
  ui-database-url: "mysql://tokyo:replace-with-password@mysql.example.internal:3306/tokyo_ui"
