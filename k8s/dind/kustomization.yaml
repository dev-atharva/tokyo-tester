apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tokyo-tester
resources:
  - namespace.yaml
  - configmap.yaml
  - persistentvolumeclaims.yaml
  - runner.yaml
  - ui.yaml
  - mcp.yaml
  - services.yaml
  - ingress.yaml
images:
  - name: tokyo-runner
    newName: ghcr.io/example/tokyo-runner
    newTag: latest
  - name: tokyo-ui
    newName: ghcr.io/example/tokyo-ui
    newTag: latest
  - name: tokyo-mcp
    newName: ghcr.io/example/tokyo-mcp
    newTag: latest
