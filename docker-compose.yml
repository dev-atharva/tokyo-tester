services:
  mysql:
    image: mysql:8.4
    container_name: tokyo-tester-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: tokyo_runner
      MYSQL_USER: tokyo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sh:/docker-entrypoint-initdb.d/001-tokyo-databases.sh:ro
    networks:
      - tokyo-tester
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  runner:
    build:
      context: ./runner-v2
      dockerfile: Dockerfile
      target: runner
    container_name: tokyo-tester-runner
    environment:
      APP_ENV: ${RUNNER_APP_ENV:-production}
      PORT: 8080
      LOG_LEVEL: ${RUNNER_LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_TYPE: ${RUNNER_DB_TYPE:-mysql}
      DATABASE_URL: ${RUNNER_DATABASE_URL:-tokyo:${MYSQL_PASSWORD}@tcp(mysql:3306)/tokyo_runner}
      DOCKER_HOST: ${RUNNER_DOCKER_HOST:-unix:///var/run/docker.sock}
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: ${TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE:-/var/run/docker.sock}
      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:-host.docker.internal}
      JANITOR_ENABLED: ${JANITOR_ENABLED:-true}
      WORKFLOW_WORKER_ENABLED: ${WORKFLOW_WORKER_ENABLED:-true}
      WORKFLOW_WORKER_CONCURRENCY: ${WORKFLOW_WORKER_CONCURRENCY:-2}
      WORKFLOW_SCENARIO_CONCURRENCY: ${WORKFLOW_SCENARIO_CONCURRENCY:-1}
      WORKFLOW_MAX_QUEUED_GLOBAL: ${WORKFLOW_MAX_QUEUED_GLOBAL:-100}
      WORKFLOW_MAX_QUEUED_PER_USER: ${WORKFLOW_MAX_QUEUED_PER_USER:-3}
      WORKFLOW_MAX_QUEUED_PER_PROJECT: ${WORKFLOW_MAX_QUEUED_PER_PROJECT:-10}
      WORKFLOW_SUBMISSIONS_PER_MINUTE_USER: ${WORKFLOW_SUBMISSIONS_PER_MINUTE_USER:-10}
      WORKFLOW_SUBMISSIONS_PER_MINUTE_PROJECT: ${WORKFLOW_SUBMISSIONS_PER_MINUTE_PROJECT:-60}
      WORKFLOW_MAX_RUNNING_PER_USER: ${WORKFLOW_MAX_RUNNING_PER_USER:-1}
      WORKFLOW_MAX_RUNNING_PER_PROJECT: ${WORKFLOW_MAX_RUNNING_PER_PROJECT:-2}
      WORKFLOW_CONTAINER_MEMORY_MB: ${WORKFLOW_CONTAINER_MEMORY_MB:-1024}
      WORKFLOW_CONTAINER_CPU_MILLI: ${WORKFLOW_CONTAINER_CPU_MILLI:-1000}
      WORKFLOW_CONTAINER_PIDS: ${WORKFLOW_CONTAINER_PIDS:-256}
      TEST_RUN_TIMEOUT_SEC: ${TEST_RUN_TIMEOUT_SEC:-0}
      WORKFLOW_JOB_LEASE_SECONDS: ${WORKFLOW_JOB_LEASE_SECONDS:-60}
      WORKFLOW_JOB_HEARTBEAT_SECONDS: ${WORKFLOW_JOB_HEARTBEAT_SECONDS:-15}
      WORKFLOW_JOB_MAX_RECOVERIES: ${WORKFLOW_JOB_MAX_RECOVERIES:-3}
      WORKFLOW_EVENT_RETENTION_DAYS: ${WORKFLOW_EVENT_RETENTION_DAYS:-30}
      WORKFLOW_JOB_ENCRYPTION_KEY: ${WORKFLOW_JOB_ENCRYPTION_KEY:?WORKFLOW_JOB_ENCRYPTION_KEY must be set}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:${CONTAINER_DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tokyo-tester
    command: ["-migrate"]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui-v2/Dockerfile
    container_name: tokyo-tester-ui
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      COTS_API_BASE_URL: ${COTS_API_BASE_URL:-http://runner:8080}
      DB_TYPE: ${UI_DB_TYPE:-mysql}
      DATABASE_URL: ${UI_DATABASE_URL:-mysql://tokyo:${MYSQL_PASSWORD}@mysql:3306/tokyo_ui}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-}
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-local-dev-mcp-internal-secret-32-bytes}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-personal_token}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-${TOKYO_TESTER_PUBLIC_ORIGIN:-http://localhost:8090}/mcp}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
    depends_on:
      mysql:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks:
      - tokyo-tester
    command: ["sh", "-c", "bun run db:migrate && exec bun server.js"]
    restart: unless-stopped

  mcp:
    profiles: ["agent", "agent-dev"]
    build:
      context: ./runner-v2
      dockerfile: Dockerfile
      target: mcp
    container_name: tokyo-tester-mcp
    environment:
      PORT: 8090
      TOKYO_TESTER_APP_URL: http://ui:3000
      MCP_ALLOWED_ORIGIN: ${TOKYO_TESTER_PUBLIC_ORIGIN:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-${TOKYO_TESTER_PUBLIC_ORIGIN:-http://localhost:8090}/mcp}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-personal_token}
      MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-local-dev-mcp-internal-secret-32-bytes}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_INTROSPECTION_URL: ${MCP_OAUTH_INTROSPECTION_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
    depends_on:
      ui:
        condition: service_healthy
    networks:
      - tokyo-tester
    restart: unless-stopped

  edge:
    profiles: ["agent"]
    image: caddy:2.10-alpine
    container_name: tokyo-tester-edge
    environment:
      TOKYO_TESTER_DOMAIN: ${TOKYO_TESTER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ui:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - tokyo-tester
    restart: unless-stopped

networks:
  tokyo-tester:
    name: tokyo-tester
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
